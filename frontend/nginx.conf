server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Large CSV uploads and slow LLM calls.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
